<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ভয়েস চ্যাট রুম</title>
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.18.2.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f6f9; margin-top: 50px; }
        .container { display: flex; justify-content: center; gap: 40px; margin-top: 30px; }
        .room-box { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .circle-btn { width: 90px; height: 90px; border-radius: 50%; background-color: #e4e6eb; border: none; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .circle-btn svg { width: 40px; height: 40px; fill: #65676b; }
        .room-label { margin-top: 10px; font-size: 18px; font-weight: bold; color: #333; }
        .controls { margin-top: 40px; }
        .leave-btn { background-color: #ff3b30; color: white; border: none; padding: 12px 25px; font-size: 16px; border-radius: 5px; cursor: pointer; display: none; }
        .status { margin-top: 20px; font-size: 15px; font-weight: bold; padding: 0 20px; }
    </style>
</head>
<body>

    <h2>ভয়েস চ্যাট রুম সিস্টেম</h2>
    <p>কথা বলতে যেকোনো একটি রুমে ক্লিক করুন</p>

    <div class="container">
        <!-- রুম ৪ -->
        <div class="room-box" onclick="joinRoom('room_4', '৪')">
            <button class="circle-btn">
                <svg viewBox="0 0 24 24"><path d="M20 9.5V7c0-1.1-.9-2-2-2H6c-1.1 0-2 .9-2 2v2.5c-1.4 0-2.5 1.1-2.5 2.5v3c0 1.4 1.1 2.5 2.5 2.5h1v2c0 .55.45 1 1 1s1-.45 1-1v-2h12v2c0 .55.45 1 1 1s1-.45 1-1v-2h1c1.4 0 2.5-1.1 2.5-2.5v-3c0-1.4-1.1-2.5-2.5-2.5zM6 7h12v2.12c-.59.55-1 1.33-1 2.21v1H7v-1c0-.88-.41-1.66-1-2.21V7zm14 8H4v-3c0-.55.45-1 1-1h14c.55 0 1 .45 1 1v3z"/></svg>
            </button>
            <span class="room-label">৪</span>
        </div>

        <!-- রুম ৫ -->
        <div class="room-box" onclick="joinRoom('room_5', '৫')">
            <button class="circle-btn">
                <svg viewBox="0 0 24 24"><path d="M20 9.5V7c0-1.1-.9-2-2-2H6c-1.1 0-2 .9-2 2v2.5c-1.4 0-2.5 1.1-2.5 2.5v3c0 1.4 1.1 2.5 2.5 2.5h1v2c0 .55.45 1 1 1s1-.45 1-1v-2h12v2c0 .55.45 1 1 1s1-.45 1-1v-2h1c1.4 0 2.5-1.1 2.5-2.5v-3c0-1.4-1.1-2.5-2.5-2.5zM6 7h12v2.12c-.59.55-1 1.33-1 2.21v1H7v-1c0-.88-.41-1.66-1-2.21V7zm14 8H4v-3c0-.55.45-1 1-1h14c.55 0 1 .45 1 1v3z"/></svg>
            </button>
            <span class="room-label">৫</span>
        </div>
    </div>

    <div class="status" id="statusText"></div>

    <div class="controls">
        <button id="leaveBtn" class="leave-btn" onclick="leaveRoom()">কল কেটে দিন</button>
    </div>

    <script>
        const APP_ID = "6bd3ac48cca3429198d3196f201b9321";
        const client = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });
        let localAudioTrack = null;
        let currentRoom = null;

        async function joinRoom(roomName, roomNum) {
            if (currentRoom) {
                alert("আপনি ইতিমধ্যেই একটি রুমে আছেন। প্রথমে কল কেটে দিন।");
                return;
            }

            try {
                document.getElementById("statusText").style.color = "#007aff";
                document.getElementById("statusText").innerText = `রুম ${roomNum}-এ যুক্ত হওয়া হচ্ছে...`;
                
                // সার্টিফিকেট অফ থাকায় এখন সরাসরি টোকেন ছাড়াই কানেক্ট হবে
                await client.join(APP_ID, roomName, null, null);
                
                localAudioTrack = await AgoraRTC.createMicrophoneAudioTrack();
                await client.publish([localAudioTrack]);
                
                currentRoom = roomNum;
                document.getElementById("statusText").style.color = "green";
                document.getElementById("statusText").innerText = `রুম ${roomNum}-এ যুক্ত আছেন। কথা বলতে পারেন।`;
                document.getElementById("leaveBtn").style.display = "inline-block";

                client.on("user-published", async (user, mediaType) => {
                    await client.subscribe(user, mediaType);
                    if (mediaType === "audio") {
                        user.audioTrack.play();
                    }
                });

            } catch (error) {
                console.error("রুমের সাথে যুক্ত হতে সমস্যা হয়েছে:", error);
                document.getElementById("statusText").style.color = "#d9534f";
                document.getElementById("statusText").innerText = "কানেক্ট করতে ব্যর্থ হয়েছে! কারণ: " + error.message;
            }
        }

        async function leaveRoom() {
            try {
                if (localAudioTrack) {
                    localAudioTrack.stop();
                    localAudioTrack.close();
                    localAudioTrack = null;
                }
                await client.leave();
                
                document.getElementById("statusText").style.color = "#333";
                document.getElementById("statusText").innerText = "কল কেটে দেওয়া হয়েছে।";
                document.getElementById("leaveBtn").style.display = "none";
                currentRoom = null;
            } catch (error) {
                console.error("রুম ছাড়তে সমস্যা হয়েছে:", error);
            }
        }
    </script>

</body>
</html>
