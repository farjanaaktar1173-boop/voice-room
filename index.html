<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Room</title>
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.20.0.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Bar Info */
        .top-bar {
            padding: 10px 15px;
            background: #1a1a1a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            font-size: 13px;
        }
        .status-badge {
            background: #28a745;
            color: #fff;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
        }

        /* Seats Layout */
        .seats-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 20px 10px;
            background: #141414;
        }
        .seat {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            cursor: pointer;
        }
        .avatar-ring {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            background: #222;
            font-size: 28px;
            transition: all 0.3s ease;
        }
        .avatar-ring.active {
            border-color: #00ffcc;
            box-shadow: 0 0 15px #00ffcc;
        }
        .seat-name {
            margin-top: 6px;
            font-size: 12px;
            color: #ccc;
        }
        .seat-id {
            font-size: 10px;
            color: #ffd700;
        }

        /* Control Buttons */
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 10px;
            background: #181818;
        }
        .btn {
            background: #ffd700;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-mic { background: #008cba; color: #fff; }

        /* Chat Section */
        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #080808;
            padding: 10px;
            overflow: hidden;
        }
        .chat-box {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-bottom: 10px;
        }
        .chat-msg {
            background: #1e1e1e;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 13px;
            max-width: 85%;
            word-break: break-word;
        }
        .chat-msg .sender {
            color: #ffd700;
            font-weight: bold;
            font-size: 11px;
            display: block;
        }

        /* Input Bar Area */
        .input-bar {
            display: flex;
            gap: 8px;
            padding: 8px;
            background: #1a1a1a;
            border-top: 1px solid #333;
            margin-bottom: 5px;
        }
        .input-bar input {
            flex: 1;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 10px 14px;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }
        .input-bar button {
            background: #ffd700;
            border: none;
            color: #000;
            padding: 0 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div>ভয়েস রুম ID: <strong id="room-id">8821</strong></div>
        <div class="status-badge" id="status">অফলাইন</div>
    </div>

    <!-- Voice Seats -->
    <div class="seats-container">
        <div class="seat" onclick="toggleSeat(1)">
            <div class="avatar-ring" id="ring-1">🎙️</div>
            <div class="seat-name" id="name-1">Seat 1 (খালি)</div>
            <div class="seat-id" id="uid-1">ID: -</div>
        </div>
        <div class="seat" onclick="toggleSeat(2)">
            <div class="avatar-ring" id="ring-2">🛋️</div>
            <div class="seat-name" id="name-2">Seat 2 (খালি)</div>
            <div class="seat-id" id="uid-2">ID: -</div>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <button class="btn btn-mic" id="mic-btn" onclick="toggleMic()">🎙️ মাইক অন করুন</button>
    </div>

    <!-- Chat Box -->
    <div class="chat-section">
        <div class="chat-box" id="chat-box">
            <div class="chat-msg">
                <span class="sender">System</span>
                ভয়েস রুমে স্বাগতম! মাইক চালু করে কথা বলুন।
            </div>
        </div>
        <div class="input-bar">
            <input type="text" id="chat-input" placeholder="মেসেজ লিখুন..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMsg()">Send</button>
        </div>
    </div>

    <script>
        const APP_ID = "7419ea365bae4f55aa431aedd5c4cd4c";
        const CHANNEL = "main-room";
        let client = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });
        let localAudioTrack = null;
        let isJoined = false;
        let myUid = Math.floor(100000 + Math.random() * 900000); // ৬ ডিজিটের ইউজার আইডি

        async function toggleMic() {
            const micBtn = document.getElementById("mic-btn");
            const statusBadge = document.getElementById("status");

            if (!isJoined) {
                try {
                    //১. Agora চ্যানেলে জয়েন
                    await client.join(APP_ID, CHANNEL, null, myUid);
                    
                    //২. মাইকের পারমিশন ও ট্র্যাক তৈরি
                    localAudioTrack = await AgoraRTC.createMicrophoneAudioTrack();
                    await client.publish([localAudioTrack]);

                    isJoined = true;
                    micBtn.innerText = "🛑 মাইক অফ করুন";
                    micBtn.style.background = "#e74c3c";
                    statusBadge.innerText = "অনলাইন (লাইভ)";
                    statusBadge.style.background = "#28a745";

                    // Seat 1-এ আইডি ও নাম বসানো
                    document.getElementById("name-1").innerText = "আপনি";
                    document.getElementById("uid-1").innerText = "ID: " + myUid;
                    document.getElementById("ring-1").classList.add("active");

                    addSystemMsg("আপনার মাইক যুক্ত হয়েছে। আইডি: " + myUid);
                } catch (err) {
                    console.error("Mic error:", err);
                    alert("মাইক অ্যাক্সেস করার অনুমতি বা ব্রাউজার পারমিশন দেওয়া হয়নি!");
                }
            } else {
                // মাইক ডিসকানেক্ট
                if (localAudioTrack) {
                    localAudioTrack.close();
                }
                await client.leave();
                isJoined = false;

                micBtn.innerText = "🎙️ মাইক অন করুন";
                micBtn.style.background = "#008cba";
                statusBadge.innerText = "অফলাইন";
                statusBadge.style.background = "#666";

                document.getElementById("name-1").innerText = "Seat 1 (খালি)";
                document.getElementById("uid-1").innerText = "ID: -";
                document.getElementById("ring-1").classList.remove("active");

                addSystemMsg("আপনি মাইক বন্ধ করেছেন।");
            }
        }

        // রিমোট ব্যবহারকারীদের অডিও শোনা
        client.on("user-published", async (user, mediaType) => {
            await client.subscribe(user, mediaType);
            if (mediaType === "audio") {
                user.audioTrack.play();
                document.getElementById("name-2").innerText = "User " + user.uid;
                document.getElementById("uid-2").innerText = "ID: " + user.uid;
                document.getElementById("ring-2").classList.add("active");
            }
        });

        client.on("user-unpublished", (user) => {
            document.getElementById("name-2").innerText = "Seat 2 (খালি)";
            document.getElementById("uid-2").innerText = "ID: -";
            document.getElementById("ring-2").classList.remove("active");
        });

        // চ্যাট ফাংশন
        function sendMsg() {
            const input = document.getElementById("chat-input");
            const text = input.value.trim();
            if (text === "") return;

            const chatBox = document.getElementById("chat-box");
            const msgDiv = document.createElement("div");
            msgDiv.className = "chat-msg";
            msgDiv.innerHTML = `<span class="sender">User (${myUid})</span>${text}`;
            
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            input.value = "";
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMsg();
        }

        function addSystemMsg(msg) {
            const chatBox = document.getElementById("chat-box");
            const msgDiv = document.createElement("div");
            msgDiv.className = "chat-msg";
            msgDiv.innerHTML = `<span class="sender" style="color:#00ffcc;">System</span>${msg}`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
