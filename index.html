<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Room & Live Chat with Agora</title>
  <!-- Agora RTC SDK -->
  <script src="https://download.agora.io/sdk/web/AgoraRTC_N-4.20.0.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Section for Voice Seats */
    .room-container {
      display: flex;
      justify-content: center;
      gap: 40px;
      padding: 30px 20px;
      background-color: #ffffff;
      border-bottom: 1px solid #f0f0f0;
    }

    .seat {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      position: relative;
    }

    /* Golden Ring Seat Styling */
    .seat-circle {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: radial-gradient(circle, #fffdf0 0%, #fef3c7 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 8px;
      border: 3px solid #d97706; /* Golden Border */
      outline: 2px solid #fef3c7;
      box-shadow: 0 4px 10px rgba(217, 119, 6, 0.25);
      overflow: hidden;
      transition: all 0.3s ease;
    }

    /* Dashed Circle when Locked */
    .seat.locked .seat-circle {
      background: #fafafa;
      border: 2px dashed #a1a1aa;
      outline: none;
      box-shadow: none;
    }

    .seat-circle svg {
      width: 34px;
      height: 34px;
      fill: #b45309;
    }

    .seat.locked .seat-circle svg {
      fill: #71717a;
    }

    .seat-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .seat-label {
      font-size: 15px;
      font-weight: bold;
      color: #1f2937;
    }

    /* Popup Modal Menu */
    .menu-modal {
      display: none;
      position: absolute;
      top: 85px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #ffffff;
      border-radius: 12px;
      width: 170px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      border: 1px solid #f3f4f6;
      z-index: 100;
      overflow: hidden;
    }

    .menu-modal.active {
      display: block;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 15px;
      color: #374151;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .menu-item:hover {
      background-color: #f9fafb;
    }

    .menu-item svg {
      width: 18px;
      height: 18px;
      fill: #4b5563;
    }

    /* Main Chat Container */
    .chat-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background-color: #ffffff;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      overflow: hidden;
    }

    /* Messages Display Box */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message-item {
      background-color: #f3f4f6;
      color: #1f2937;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      max-width: 80%;
      word-wrap: break-word;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .message-item.user-msg {
      background-color: #dbeafe;
      color: #1e40af;
      align-self: flex-end;
      border-bottom-left-radius: 16px;
      border-bottom-right-radius: 4px;
    }

    /* Fixed Chat Input Box at Bottom */
    .chat-input-box {
      display: flex;
      gap: 10px;
      padding: 12px 15px;
      background-color: #ffffff;
      border-top: 1px solid #e5e7eb;
    }

    .chat-input-box input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #d1d5db;
      border-radius: 25px;
      outline: none;
      font-size: 14px;
      background-color: #f9fafb;
    }

    .chat-input-box input:focus {
      border-color: #d97706;
      background-color: #ffffff;
    }

    .chat-input-box button {
      background-color: #d97706;
      color: #ffffff;
      border: none;
      padding: 12px 20px;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .chat-input-box button:hover {
      background-color: #b45309;
    }
  </style>
</head>
<body>

  <!-- Voice Seats Container -->
  <div class="room-container">
    <!-- Room 1 -->
    <div class="seat" id="seat-1" onclick="toggleMenu(event, 1)">
      <div class="seat-circle" id="icon-1">
        <svg viewBox="0 0 24 24"><path d="M20,9V7D20,5.89 19.1,5 18,5H6D4.89,5 4,5.89 4,7V9D2.89,9 2,9.89 2,11V17D2,18.11 2.89,19 4,19V21H6V19H18V21H20V19D21.11,19 22,18.11 22,17V11D22,9.89 21.11,9 20,9M6,7H18V9H6V7M20,17H4V11H20V17Z"/></svg>
      </div>
      <span class="seat-label" id="label-1">1</span>

      <div class="menu-modal" id="menu-1">
        <div class="menu-item" onclick="takeMic(event, 1)">
          <svg viewBox="0 0 24 24"><path d="M20,9V7D20,5.89 19.1,5 18,5H6D4.89,5 4,5.89 4,7V9D2.89,9 2,9.89 2,11V17D2,18.11 2.89,19 4,19V21H6V19H18V21H20V19D21.11,19 22,18.11 22,17V11D22,9.89 21.11,9 20,9M6,7H18V9H6V7M20,17H4V11H20V17Z"/></svg>
          <span id="mic-text-1">Take Mic</span>
        </div>
        <div class="menu-item" onclick="event.stopPropagation(); closeAllMenus();">
          <svg viewBox="0 0 24 24"><path d="M15,14C12.33,14 7,15.33 7,18V20H23V18C23,15.33 17.67,14 15,14M15,12A4,4 0 0,0 19,8A4,4 0 0,0 15,4A4,4 0 0,0 11,8A4,4 0 0,0 15,12M5,13V10H3V13H0V15H3V18H5V15H8V13H5Z"/></svg>
          Invite Speaker
        </div>
        <div class="menu-item" onclick="toggleLock(event, 1)">
          <svg viewBox="0 0 24 24"><path d="M12,17A2,2 0 0,0 14,15C14,13.89 13.1,13 12,13A2,2 0 0,0 10,15A2,2 0 0,0 12,17M18,8A2,2 0 0,1 20,10V20A2,2 0 0,1 18,22H6A2,2 0 0,1 4,20V10C4,8.89 4.89,8 6,8H7V6A5,5 0 0,1 12,1A5,5 0 0,1 17,6V8H18M12,3A3,3 0 0,0 9,6V8H15V6A3,3 0 0,0 12,3Z"/></svg>
          <span id="lock-text-1">Lock Mic</span>
        </div>
      </div>
    </div>

    <!-- Room 2 -->
    <div class="seat" id="seat-2" onclick="toggleMenu(event, 2)">
      <div class="seat-circle" id="icon-2">
        <svg viewBox="0 0 24 24"><path d="M20,9V7D20,5.89 19.1,5 18,5H6D4.89,5 4,5.89 4,7V9D2.89,9 2,9.89 2,11V17D2,18.11 2.89,19 4,19V21H6V19H18V21H20V19D21.11,19 22,18.11 22,17V11D22,9.89 21.11,9 20,9M6,7H18V9H6V7M20,17H4V11H20V17Z"/></svg>
      </div>
      <span class="seat-label" id="label-2">2</span>

      <div class="menu-modal" id="menu-2">
        <div class="menu-item" onclick="takeMic(event, 2)">
          <svg viewBox="0 0 24 24"><path d="M20,9V7D20,5.89 19.1,5 18,5H6D4.89,5 4,5.89 4,7V9D2.89,9 2,9.89 2,11V17D2,18.11 2.89,19 4,19V21H6V19H18V21H20V19D21.11,19 22,18.11 22,17V11D22,9.89 21.11,9 20,9M6,7H18V9H6V7M20,17H4V11H20V17Z"/></svg>
          <span id="mic-text-2">Take Mic</span>
        </div>
        <div class="menu-item" onclick="event.stopPropagation(); closeAllMenus();">
          <svg viewBox="0 0 24 24"><path d="M15,14C12.33,14 7,15.33 7,18V20H23V18C23,15.33 17.67,14 15,14M15,12A4,4 0 0,0 19,8A4,4 0 0,0 15,4A4,4 0 0,0 11,8A4,4 0 0,0 15,12M5,13V10H3V13H0V15H3V18H5V15H8V13H5Z"/></svg>
          Invite Speaker
        </div>
        <div class="menu-item" onclick="toggleLock(event, 2)">
          <svg viewBox="0 0 24 24"><path d="M12,17A2,2 0 0,0 14,15C14,13.89 13.1,13 12,13A2,2 0 0,0 10,15A2,2 0 0,0 12,17M18,8A2,2 0 0,1 20,10V20A2,2 0 0,1 18,22H6A2,2 0 0,1 4,20V10C4,8.89 4.89,8 6,8H7V6A5,5 0 0,1 12,1A5,5 0 0,1 17,6V8H18M12,3A3,3 0 0,0 9,6V8H15V6A3,3 0 0,0 12,3Z"/></svg>
          <span id="lock-text-2">Lock Mic</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Chat Messaging Interface -->
  <div class="chat-section">
    <div class="chat-messages" id="chatBox">
      <div class="message-item">Welcome to Live Voice Room!</div>
    </div>
    
    <div class="chat-input-box">
      <input type="text" id="messageInput" placeholder="মেসেজ লিখুন..." onkeypress="handleKeyPress(event)">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    /* AGORA CONFIGURATION */
    const AGORA_APP_ID = "7419ea365bae4f55aa431aedd5c4cd4c";
    const CHANNEL_NAME = "main_voice_room";
    let agoraClient = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });
    let localAudioTrack = null;
    let isJoined = false;

    const sofaSVG = `<svg viewBox="0 0 24 24"><path d="M20,9V7D20,5.89 19.1,5 18,5H6D4.89,5 4,5.89 4,7V9D2.89,9 2,9.89 2,11V17D2,18.11 2.89,19 4,19V21H6V19H18V21H20V19D21.11,19 22,18.11 22,17V11D22,9.89 21.11,9 20,9M6,7H18V9H6V7M20,17H4V11H20V17Z"/></svg>`;
    const lockSVG = `<svg viewBox="0 0 24 24"><path d="M12,17A2,2 0 0,0 14,15C14,13.89 13.1,13 12,13A2,2 0 0,0 10,15A2,2 0 0,0 12,17M18,8A2,2 0 0,1 20,10V20A2,2 0 0,1 18,22H6A2,2 0 0,1 4,20V10C4,8.89 4.89,8 6,8H7V6A5,5 0 0,1 12,1A5,5 0 0,1 17,6V8H18M12,3A3,3 0 0,0 9,6V8H15V6A3,3 0 0,0 12,3Z"/></svg>`;
    const fakeAvatarURL = 'https://i.pravatar.cc/150?img=12';

    let currentOccupiedSeat = null;

    /* AGORA VOICE EVENT LISTENERS */
    agoraClient.on("user-published", async (user, mediaType) => {
      await agoraClient.subscribe(user, mediaType);
      if (mediaType === "audio") {
        user.audioTrack.play();
      }
    });

    async function joinVoiceChannel() {
      try {
        await agoraClient.join(AGORA_APP_ID, CHANNEL_NAME, null, null);
        localAudioTrack = await AgoraRTC.createMicrophoneAudioTrack();
        await agoraClient.publish([localAudioTrack]);
        isJoined = true;
      } catch (error) {
        console.error("Agora Voice Join Error:", error);
      }
    }

    async function leaveVoiceChannel() {
      if (localAudioTrack) {
        localAudioTrack.stop();
        localAudioTrack.close();
        localAudioTrack = null;
      }
      await agoraClient.leave();
      isJoined = false;
    }

    /* SEAT MENU FUNCTIONS */
    function toggleMenu(event, seatId) {
      event.stopPropagation();
      const menu = document.getElementById(`menu-${seatId}`);
      const isVisible = menu.classList.contains('active');
      closeAllMenus();
      if (!isVisible) {
        menu.classList.add('active');
      }
    }

    async function takeMic(event, targetSeatId) {
      event.stopPropagation();
      const targetSeat = document.getElementById(`seat-${targetSeatId}`);

      if (targetSeat.classList.contains('locked')) {
        alert("এই রুমটি লক করা আছে!");
        closeAllMenus();
        return;
      }

      // If user clicks Leave Mic
      if (currentOccupiedSeat === targetSeatId) {
        await leaveVoiceChannel();
        resetSeat(targetSeatId);
        document.getElementById(`mic-text-${targetSeatId}`).innerText = 'Take Mic';
        currentOccupiedSeat = null;
      } else {
        // Leave previous seat if occupied
        if (currentOccupiedSeat !== null) {
          resetSeat(currentOccupiedSeat);
          document.getElementById(`mic-text-${currentOccupiedSeat}`).innerText = 'Take Mic';
        }

        // Join voice room
        await joinVoiceChannel();
        document.getElementById(`icon-${targetSeatId}`).innerHTML = `<img src="${fakeAvatarURL}" alt="User">`;
        document.getElementById(`label-${targetSeatId}`).innerText = 'ইউজার-১';
        document.getElementById(`mic-text-${targetSeatId}`).innerText = 'Leave Mic';
        currentOccupiedSeat = targetSeatId;
      }

      closeAllMenus();
    }

    function resetSeat(seatId) {
      const seat = document.getElementById(`seat-${seatId}`);
      if (!seat.classList.contains('locked')) {
        document.getElementById(`icon-${seatId}`).innerHTML = sofaSVG;
      } else {
        document.getElementById(`icon-${seatId}`).innerHTML = lockSVG;
      }
      document.getElementById(`label-${seatId}`).innerText = seatId;
    }

    async function toggleLock(event, seatId) {
      event.stopPropagation();
      const seat = document.getElementById(`seat-${seatId}`);
      const iconContainer = document.getElementById(`icon-${seatId}`);
      const lockText = document.getElementById(`lock-text-${seatId}`);

      if (currentOccupiedSeat === seatId) {
        await leaveVoiceChannel();
        currentOccupiedSeat = null;
        document.getElementById(`label-${seatId}`).innerText = seatId;
      }

      if (seat.classList.contains('locked')) {
        seat.classList.remove('locked');
        iconContainer.innerHTML = sofaSVG;
        lockText.innerText = 'Lock Mic';
      } else {
        seat.classList.add('locked');
        iconContainer.innerHTML = lockSVG;
        lockText.innerText = 'Unlock Mic';
      }
      closeAllMenus();
    }

    function closeAllMenus() {
      document.querySelectorAll('.menu-modal').forEach(menu => {
        menu.classList.remove('active');
      });
    }

    /* CHAT MESSAGING FUNCTIONS */
    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (text !== "") {
        const chatBox = document.getElementById('chatBox');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message-item user-msg';
        msgDiv.innerText = text;
        
        chatBox.appendChild(msgDiv);
        input.value = "";
        
        // Auto Scroll to Bottom
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        sendMessage();
      }
    }

    document.addEventListener('click', closeAllMenus);
  </script>

</body>
        </html>
