<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Messenger Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background: #fff;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        /* Header */
        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px;
            border-bottom: 1px solid #e4e6eb;
            background: #fff;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-info img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        .user-details h3 {
            font-size: 16px;
            color: #050505;
        }
        .user-details span {
            font-size: 12px;
            color: #31a24c;
            font-weight: 600;
        }
        .header-icons {
            display: flex;
            gap: 20px;
            color: #0084ff;
            font-size: 20px;
            cursor: pointer;
        }
        /* Chat Body */
        .chat-body {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #ffffff;
            scroll-behavior: smooth;
        }
        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 75%;
        }
        .message-wrapper.outgoing {
            align-self: flex-end;
            align-items: flex-end;
        }
        .message-wrapper.incoming {
            align-self: flex-start;
            align-items: flex-start;
        }
        .sender-name {
            font-size: 11px;
            color: #65676b;
            margin-bottom: 2px;
            margin-left: 4px;
        }
        .message {
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 14px;
            position: relative;
            word-wrap: break-word;
            width: 100%;
        }
        .message.incoming {
            background: #f0f0f0;
            color: #050505;
            border-bottom-left-radius: 4px;
        }
        .message.outgoing {
            background: #0084ff;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .message img, .message video {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 5px;
            display: block;
        }
        .time {
            font-size: 10px;
            margin-top: 4px;
            opacity: 0.7;
        }
        /* Chat Footer */
        .chat-footer {
            display: flex;
            align-items: center;
            padding: 10px;
            border-top: 1px solid #e4e6eb;
            background: #fff;
            gap: 10px;
            position: relative;
        }
        .chat-footer .actions {
            display: flex;
            gap: 12px;
            color: #0084ff;
            font-size: 20px;
            cursor: pointer;
        }
        .input-box {
            flex: 1;
            display: flex;
            align-items: center;
            background: #f0f2f5;
            border-radius: 20px;
            padding: 8px 15px;
            gap: 8px;
        }
        .input-box input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-size: 14px;
        }
        .send-btn {
            background: transparent;
            border: none;
            color: #0084ff;
            font-size: 20px;
            cursor: pointer;
        }
        /* Emoji Picker Box */
        .emoji-picker {
            position: absolute;
            bottom: 65px;
            left: 10px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 10px;
            display: none;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            font-size: 22px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            z-index: 100;
            max-width: 250px;
        }
        .emoji-picker span {
            cursor: pointer;
            text-align: center;
            transition: transform 0.1s;
        }
        .emoji-picker span:hover {
            transform: scale(1.2);
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Header Section -->
        <div class="chat-header">
            <div class="user-info">
                <i class="fa-solid fa-arrow-left" style="font-size: 18px; cursor: pointer;"></i>
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="Profile">
                <div class="user-details">
                    <h3 id="roomTitle">Group Chat</h3>
                    <span>Active Now</span>
                </div>
            </div>
            <div class="header-icons">
                <i class="fa-solid fa-phone"></i>
                <i class="fa-solid fa-video"></i>
                <i class="fa-solid fa-ellipsis-vertical"></i>
            </div>
        </div>

        <!-- Messages Area -->
        <div class="chat-body" id="chatBody"></div>

        <!-- Rich Emoji Picker -->
        <div class="emoji-picker" id="emojiPicker">
            <span onclick="addEmoji('😊')">😊</span>
            <span onclick="addEmoji('😂')">😂</span>
            <span onclick="addEmoji('❤️')">❤️</span>
            <span onclick="addEmoji('🔥')">🔥</span>
            <span onclick="addEmoji('👍')">👍</span>
            <span onclick="addEmoji('😍')">😍</span>
            <span onclick="addEmoji('😢')">😢</span>
            <span onclick="addEmoji('😎')">😎</span>
            <span onclick="addEmoji('🙏')">🙏</span>
            <span onclick="addEmoji('✨')">✨</span>
            <span onclick="addEmoji('🎉')">🎉</span>
            <span onclick="addEmoji('🥳')">🥳</span>
            <span onclick="addEmoji('😘')">😘</span>
            <span onclick="addEmoji('😜')">😜</span>
            <span onclick="addEmoji('💪')">💪</span>
            <span onclick="addEmoji('🌹')">🌹</span>
            <span onclick="addEmoji('⭐')">⭐</span>
            <span onclick="addEmoji('🚀')">🚀</span>
        </div>

        <!-- Footer / Input Area -->
        <div class="chat-footer">
            <div class="actions">
                <!-- ছবি পাঠানোর অপশন -->
                <label for="imageInput" title="ছবি পাঠান"><i class="fa-regular fa-image" style="cursor: pointer;"></i></label>
                <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="sendFile(event, 'image')">

                <!-- ভিডিও পাঠানোর অপশন -->
                <label for="videoInput" title="ভিডিও পাঠান"><i class="fa-solid fa-video" style="cursor: pointer; color: #0084ff;"></i></label>
                <input type="file" id="videoInput" accept="video/*" style="display: none;" onchange="sendFile(event, 'video')">
            </div>

            <div class="input-box">
                <input type="text" id="messageInput" placeholder="Aa" onkeypress="handleKeyPress(event)">
                <i class="fa-regular fa-face-smile" style="color: #0084ff; cursor: pointer;" onclick="toggleEmojiPicker()"></i>
            </div>
            <button class="send-btn" onclick="sendTextMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- Firebase SDK & Chat Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCTn3QEYtRMxm7Y91RSFSvbRJSRHcXMEdI",
            authDomain: "room-7fbf7.firebaseapp.com",
            databaseURL: "https://room-7fbf7-default-rtdb.firebaseio.com",
            projectId: "room-7fbf7",
            storageBucket: "room-7fbf7.firebasestorage.app",
            messagingSenderId: "417946695868",
            appId: "1:417946695868:web:34c6f63269aaf659b2b8b9",
            measurementId: "G-EG726ZPVK7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const chatRef = ref(db, 'chats');

        // ইউজারের নাম সেটআপ (প্রবেশ করার সাথে সাথে নাম চাইবে)
        let userName = localStorage.getItem("chat_user_name");
        if (!userName || userName.trim() === "") {
            userName = prompt("আপনার নামটি লিখুন:", "Guest User");
            if (!userName || userName.trim() === "") {
                userName = "Anonymous";
            }
            localStorage.setItem("chat_user_name", userName);
        }
        document.getElementById('roomTitle').innerText = `Chat (${userName})`;

        // টেক্সট মেসেজ পাঠানো
        window.sendTextMessage = function() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (text === "") return;

            push(chatRef, {
                type: 'text',
                content: text,
                senderName: userName,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });

            input.value = "";
        };

        // এন্টার প্রেস করলে মেসেজ সেন্ড
        window.handleKeyPress = function(e) {
            if (e.key === 'Enter') {
                sendTextMessage();
            }
        };

        // ছবি বা ভিডিও ফাইল পাঠানো (Base64 কনভার্ট করে ফায়ারবেসে সেভ)
        window.sendFile = function(event, type) {
            const file = event.target.files[0];
            if (file) {
                // ফাইলের সাইজ চেক (বড় ভিডিওর জন্য লিমিট)
                if (file.size > 15 * 1024 * 1024) {
                    alert("ফাইলটি খুব বড়! দয়া করে ১৫ MB এর কম সাইজের ভিডিও বা ছবি দিন।");
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(e) {
                    push(chatRef, {
                        type: type, // 'image' বা 'video'
                        content: e.target.result,
                        senderName: userName,
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    });
                }
                reader.readAsDataURL(file);
            }
        };

        // ফায়ারবেস থেকে রিয়েল-টাইমে সব মেসেজ লোড করা
        const chatBody = document.getElementById('chatBody');
        onChildAdded(chatRef, (snapshot) => {
            const data = snapshot.val();
            const wrapperDiv = document.createElement('div');
            
            // কে পাঠিয়েছে তার উপর ভিত্তি করে পজিশন নির্ধারণ (নিজের মেসেজ ডানে, অন্যেরটা বামে)
            const isMe = data.senderName === userName;
            wrapperDiv.classList.add('message-wrapper', isMe ? 'outgoing' : 'incoming');

            // যার নাম সে পাঠিয়েছে তার নাম উপরে শো করবে
            let htmlContent = `<div class="sender-name">${escapeHtml(data.senderName)}</div>`;

            if (data.type === 'text') {
                htmlContent += `<div class="message ${isMe ? 'outgoing' : 'incoming'}">${escapeHtml(data.content)}<div class="time">${data.time}</div></div>`;
            } else if (data.type === 'image') {
                htmlContent += `<div class="message ${isMe ? 'outgoing' : 'incoming'}"><img src="${data.content}" alt="Image"><div class="time">${data.time}</div></div>`;
            } else if (data.type === 'video') {
                htmlContent += `<div class="message ${isMe ? 'outgoing' : 'incoming'}"><video src="${data.content}" controls></video><div class="time">${data.time}</div></div>`;
            }

            wrapperDiv.innerHTML = htmlContent;
            chatBody.appendChild(wrapperDiv);
            chatBody.scrollTop = chatBody.scrollHeight;
        });

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>

    <script>
        // ইমোজি পিকার টগল
        function toggleEmojiPicker() {
            const picker = document.getElementById('emojiPicker');
            picker.style.display = picker.style.display === 'grid' ? 'none' : 'grid';
        }

        // ইনপুটে ইমোজি যোগ করা
        function addEmoji(emoji) {
            const input = document.getElementById('messageInput');
            input.value += emoji;
            document.getElementById('emojiPicker').style.display = 'none';
            input.focus();
        }
    </script>
</body>
</html>
