<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Romantic Chat 💕</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,'Noto Sans Bengali',Tahoma,sans-serif;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{background:#0a0616;display:flex;justify-content:center;align-items:center;height:100dvh;overflow:hidden;color:#fff;position:relative;}

/* Romantic Background */
.bg-orbs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.bg-orbs span{position:absolute;border-radius:50%;filter:blur(90px);opacity:.6;}
.bg-orbs span:nth-child(1){width:340px;height:340px;background:#ec4899;top:-90px;left:-90px;animation:float1 16s ease-in-out infinite;}
.bg-orbs span:nth-child(2){width:300px;height:300px;background:#a855f7;bottom:-100px;right:-80px;animation:float2 19s ease-in-out infinite;}
.bg-orbs span:nth-child(3){width:260px;height:260px;background:#f472b6;top:45%;left:58%;animation:float3 22s ease-in-out infinite;}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(80px,60px) scale(1.25);}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-70px,-70px) scale(1.18);}}
@keyframes float3{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-90px,50px) scale(1.3);}}

/* Floating Hearts */
.hearts-bg{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
.hearts-bg span{position:absolute;font-size:16px;opacity:.25;animation:floatHeart linear infinite;}
@keyframes floatHeart{0%{transform:translateY(100vh) rotate(0deg);opacity:0;}10%{opacity:.3;}90%{opacity:.3;}100%{transform:translateY(-10vh) rotate(360deg);opacity:0;}}

/* Lock Screen */
.lock-screen{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0%,#3a1454 0%,#0a0616 65%);transition:opacity .65s ease,transform .65s ease,filter .65s ease;padding:18px;}
.lock-screen.hide{opacity:0;transform:scale(1.15);filter:blur(14px);pointer-events:none;}
.lock-emoji-float{position:absolute;font-size:26px;opacity:.2;animation:floatEmoji 9s ease-in-out infinite;user-select:none;}
@keyframes floatEmoji{0%,100%{transform:translateY(0) rotate(0);}50%{transform:translateY(-28px) rotate(14deg);}}
.lock-card{width:min(92vw,380px);padding:30px 24px 26px;border-radius:32px;background:linear-gradient(160deg,rgba(236,72,153,.15),rgba(168,85,247,.08));border:1px solid rgba(244,114,182,.3);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);box-shadow:0 34px 80px rgba(236,72,153,.35),inset 0 1px 0 rgba(255,255,255,.28);text-align:center;position:relative;animation:cardIn .8s cubic-bezier(.2,.8,.2,1.1) both;}
@keyframes cardIn{from{opacity:0;transform:translateY(40px) scale(.9);}to{opacity:1;transform:translateY(0) scale(1);}}
.lock-card.shake{animation:shake .55s cubic-bezier(.36,.07,.19,.97);}
@keyframes shake{10%,90%{transform:translateX(-6px);}20%,80%{transform:translateX(6px);}30%,50%,70%{transform:translateX(-10px);}40%,60%{transform:translateX(10px);}}
.lock-badge{width:80px;height:80px;margin:0 auto 16px;border-radius:28px;display:grid;place-items:center;font-size:36px;background:linear-gradient(145deg,#ec4899,#a855f7);border:1px solid rgba(255,255,255,.28);box-shadow:0 16px 40px rgba(236,72,153,.6),inset 0 2px 6px rgba(255,255,255,.4);animation:heartBeat 1.5s ease-in-out infinite;}
@keyframes heartBeat{0%,100%{transform:scale(1);}15%{transform:scale(1.15);}30%{transform:scale(1);}45%{transform:scale(1.1);}}
.lock-card h1{font-size:22px;font-weight:700;background:linear-gradient(90deg,#fff,#fbcfe8,#f9a8d4);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px;}
.lock-sub{font-size:13px;color:rgba(255,255,255,.65);margin-bottom:4px;}
.pin-dots{display:flex;justify-content:center;gap:14px;margin:22px 0 8px;}
.pin-dots span{width:16px;height:16px;border-radius:50%;border:2px solid rgba(244,114,182,.4);transition:.28s cubic-bezier(.2,.8,.2,1.5);}
.pin-dots span.filled{background:linear-gradient(135deg,#ec4899,#f472b6);border-color:transparent;transform:scale(1.3);box-shadow:0 0 20px rgba(236,72,153,.95);}
.pin-dots span.ok{background:linear-gradient(135deg,#22c55e,#4ade80);border-color:transparent;box-shadow:0 0 20px rgba(34,197,94,.9);}
.pin-msg{min-height:20px;font-size:12.5px;font-weight:600;color:#fca5a5;transition:.2s;}
.pin-msg.good{color:#86efac;}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:20px;}
.key{height:56px;border-radius:19px;border:1px solid rgba(244,114,182,.18);background:linear-gradient(160deg,rgba(236,72,153,.15),rgba(168,85,247,.08));color:#fff;font-size:20px;font-weight:600;cursor:pointer;display:grid;place-items:center;transition:transform .16s ease,background .25s;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 6px 14px rgba(0,0,0,.35);}
.key:hover{background:linear-gradient(160deg,rgba(236,72,153,.5),rgba(168,85,247,.3));transform:translateY(-3px);}
.key:active{transform:scale(.9);}
.key.ghost{background:transparent;border:none;box-shadow:none;pointer-events:none;}
.name-step{display:none;}
.name-step.show{display:block;animation:cardIn .5s ease both;}
.name-input{width:100%;margin-top:20px;padding:15px 18px;border-radius:18px;border:1px solid rgba(244,114,182,.3);background:rgba(236,72,153,.1);color:#fff;font-size:15px;outline:none;text-align:center;}
.name-input::placeholder{color:rgba(255,255,255,.4);}
.name-input:focus{border-color:rgba(236,72,153,.9);box-shadow:0 0 0 4px rgba(236,72,153,.25);}
.uid-badge{display:inline-block;margin-top:12px;padding:6px 14px;border-radius:14px;background:rgba(236,72,153,.2);border:1px solid rgba(244,114,182,.5);font-size:11.5px;color:#fbcfe8;font-weight:600;letter-spacing:.5px;font-family:monospace;}
.btn-primary{width:100%;margin-top:14px;padding:15px;border:none;border-radius:18px;font-size:15px;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(135deg,#ec4899,#a855f7 55%,#f472b6);background-size:200% 200%;box-shadow:0 14px 30px rgba(236,72,153,.55);animation:gradShift 5s ease infinite;}
@keyframes gradShift{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
</style><style>
.chat-container{width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;background:rgba(20,10,32,.82);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 34px 90px rgba(236,72,153,.35);overflow:hidden;position:relative;z-index:2;animation:chatIn .8s cubic-bezier(.2,.8,.2,1) both;}
@keyframes chatIn{from{opacity:0;transform:translateY(26px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
@media(min-width:520px){.chat-container{height:92dvh;border-radius:28px;border:1px solid rgba(244,114,182,.2);}}
.chat-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:linear-gradient(135deg,rgba(236,72,153,.4),rgba(168,85,247,.25));border-bottom:1px solid rgba(244,114,182,.2);position:relative;z-index:5;flex-shrink:0;}
.user-info{display:flex;align-items:center;gap:10px;min-width:0;}
.back-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fbcfe8;font-size:16px;cursor:pointer;flex-shrink:0;}
.avatar-wrap{position:relative;width:44px;height:44px;flex-shrink:0;}
.avatar-wrap img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid rgba(244,114,182,.5);box-shadow:0 0 12px rgba(236,72,153,.5);}
.avatar-wrap::after{content:'';position:absolute;bottom:1px;right:1px;width:12px;height:12px;border-radius:50%;background:#22c55e;border:2px solid #1a0b22;animation:onlinePulse 2s ease-in-out infinite;}
@keyframes onlinePulse{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.8);}50%{box-shadow:0 0 0 7px rgba(34,197,94,0);}}
.avatar-wrap.offline::after{background:#6b7280 !important;box-shadow:none !important;animation:none !important;}
.user-details{min-width:0;display:flex;flex-direction:column;}
.user-details span{font-size:12px;font-weight:600;letter-spacing:.3px;transition:.3s;}
.user-details .myuid{font-size:9.5px;color:rgba(251,207,232,.7);font-family:monospace;margin-top:1px;}
.header-icons{display:flex;gap:8px;position:relative;}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(236,72,153,.15);border:1px solid rgba(244,114,182,.25);color:#fbcfe8;font-size:14px;cursor:pointer;transition:.25s cubic-bezier(.2,.8,.2,1.3);}
.icon-btn:hover{background:linear-gradient(135deg,#ec4899,#a855f7);color:#fff;transform:translateY(-3px) scale(1.1);box-shadow:0 10px 22px rgba(236,72,153,.5);}
.header-menu{position:absolute;top:48px;right:0;background:rgba(30,15,45,.98);backdrop-filter:blur(24px);border:1px solid rgba(244,114,182,.3);border-radius:16px;padding:8px;min-width:230px;box-shadow:0 20px 50px rgba(0,0,0,.7);z-index:200;opacity:0;visibility:hidden;transform:translateY(-8px) scale(.95);transition:.25s cubic-bezier(.2,.8,.2,1.25);}
.header-menu.show{opacity:1;visibility:visible;transform:translateY(0) scale(1);}
.header-menu .menu-info{padding:8px 12px 10px;border-bottom:1px solid rgba(244,114,182,.15);margin-bottom:6px;}
.header-menu .menu-info label{font-size:10px;color:rgba(251,207,232,.6);text-transform:uppercase;letter-spacing:.5px;}
.header-menu .menu-info .uid-val{font-family:monospace;font-size:11px;color:#fbcfe8;word-break:break-all;margin-top:3px;user-select:all;}
.header-menu button{width:100%;padding:11px 14px;background:transparent;border:none;color:#fff;font-size:13.5px;text-align:left;cursor:pointer;border-radius:10px;display:flex;align-items:center;gap:10px;font-family:inherit;transition:.2s;}
.header-menu button:hover{background:rgba(236,72,153,.2);color:#fbcfe8;}
.header-menu button i{font-size:14px;}

.chat-body{flex:1;padding:18px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;background:radial-gradient(circle at 15% 10%,rgba(236,72,153,.12),transparent 45%),radial-gradient(circle at 85% 85%,rgba(168,85,247,.1),transparent 45%);scroll-behavior:smooth;position:relative;}
.chat-body::-webkit-scrollbar{width:6px;}
.chat-body::-webkit-scrollbar-thumb{background:rgba(244,114,182,.35);border-radius:10px;}
.message-wrapper{display:flex;flex-direction:column;max-width:78%;animation:popIn .42s cubic-bezier(.18,.89,.32,1.28) both;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .15s;position:relative;}
.message-wrapper:active{transform:scale(.98);}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.94);}to{opacity:1;transform:translateY(0) scale(1);}}
.message-wrapper.outgoing{align-self:flex-end;align-items:flex-end;}
.message-wrapper.incoming{align-self:flex-start;align-items:flex-start;}
.sender-name{font-size:11px;color:rgba(251,207,232,.6);margin-bottom:4px;margin-left:6px;font-weight:600;}
.message{padding:10px 14px;border-radius:19px;font-size:14.5px;line-height:1.55;word-wrap:break-word;width:100%;box-shadow:0 8px 22px rgba(0,0,0,.3);position:relative;}
.message.incoming{background:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.05));border:1px solid rgba(244,114,182,.15);color:#eaeaff;border-bottom-left-radius:6px;}
.message.outgoing{background:linear-gradient(135deg,#ec4899,#d946ef 55%,#a855f7);color:#fff;border-bottom-right-radius:6px;box-shadow:0 10px 26px rgba(236,72,153,.45),inset 0 1px 0 rgba(255,255,255,.28);}
.message img,.message video{max-width:100%;border-radius:12px;margin-top:5px;display:block;}
.time{font-size:10px;margin-top:5px;opacity:.72;text-align:right;}
.message.incoming .time{text-align:left;}

/* Emoji message in chat */
.emoji-msg{padding:6px !important;background:transparent !important;border:none !important;box-shadow:none !important;}
.emoji-msg img{width:70px;height:70px;object-fit:contain;display:block;margin:0 auto;animation:emojiBounce .5s cubic-bezier(.2,.8,.2,1.5) both;}
@keyframes emojiBounce{0%{transform:scale(.3) rotate(-15deg);opacity:0;}70%{transform:scale(1.15) rotate(8deg);opacity:1;}100%{transform:scale(1) rotate(0);opacity:1;}}

/* Voice Player */
.voice-player{display:flex;align-items:center;gap:10px;padding:6px 2px;min-width:200px;max-width:100%;}
.voice-player .play-btn{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.25);border:none;color:#fff;cursor:pointer;display:grid;place-items:center;font-size:15px;flex-shrink:0;transition:.2s;}
.voice-player .play-btn:hover{background:rgba(255,255,255,.4);transform:scale(1.08);}
.voice-player .play-btn:active{transform:scale(.9);}
.voice-player .voice-bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden;position:relative;cursor:pointer;min-width:70px;}
.voice-player .voice-bar-inner{height:100%;width:0%;background:linear-gradient(90deg,#fbcfe8,#fff);border-radius:3px;transition:width .1s linear;box-shadow:0 0 8px rgba(255,255,255,.6);}
.voice-player .voice-time{font-size:11.5px;opacity:.92;font-variant-numeric:tabular-nums;min-width:42px;text-align:right;font-weight:700;}
.voice-label{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;opacity:.85;margin-bottom:4px;}
</style><style>
/* Emoji Picker */
.emoji-picker{position:absolute;bottom:78px;left:10px;width:290px;max-height:320px;overflow-y:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:12px;border-radius:24px;background:rgba(30,15,45,.98);backdrop-filter:blur(26px);border:1px solid rgba(244,114,182,.3);z-index:100;opacity:0;visibility:hidden;transform:translateY(20px) scale(.88);transform-origin:bottom left;transition:.35s cubic-bezier(.2,.8,.2,1.25);box-shadow:0 24px 60px rgba(236,72,153,.4);}
.emoji-picker.show{opacity:1;visibility:visible;transform:translateY(0) scale(1);}
.emoji-picker::-webkit-scrollbar{width:5px;}
.emoji-picker::-webkit-scrollbar-thumb{background:rgba(244,114,182,.4);border-radius:10px;}
.emoji-item{aspect-ratio:1/1;border-radius:14px;background:rgba(236,72,153,.1);border:1px solid rgba(244,114,182,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.22s cubic-bezier(.2,.8,.2,1.4);overflow:hidden;padding:4px 2px;}
.emoji-item:hover{background:rgba(236,72,153,.3);transform:translateY(-3px) scale(1.08);box-shadow:0 10px 22px rgba(236,72,153,.5);}
.emoji-item:active{transform:scale(.9);}
.emoji-item img{width:38px;height:38px;object-fit:contain;pointer-events:none;}
.emoji-item .emoji-label{font-size:8.5px;color:rgba(251,207,232,.85);font-weight:600;margin-top:2px;text-align:center;line-height:1.1;}

/* Fullscreen Emoji Reaction */
.emoji-fullscreen{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:rgba(10,3,20,.88);backdrop-filter:blur(12px);}
.emoji-fullscreen.show{display:flex;animation:fsFade .3s ease both;}
@keyframes fsFade{from{opacity:0;}to{opacity:1;}}
.emoji-fullscreen .fs-inner{text-align:center;animation:fsPop .55s cubic-bezier(.2,.8,.2,1.5) both;}
@keyframes fsPop{0%{transform:scale(.2) rotate(-25deg);opacity:0;}70%{transform:scale(1.15) rotate(8deg);opacity:1;}100%{transform:scale(1) rotate(0);opacity:1;}}
.emoji-fullscreen .fs-inner img{width:min(75vw,360px);height:auto;filter:drop-shadow(0 20px 50px rgba(236,72,153,.8));}
.emoji-fullscreen .fs-name{margin-top:22px;font-size:16px;font-weight:700;color:#fbcfe8;}
.emoji-fullscreen .fs-sub{margin-top:6px;font-size:12px;color:rgba(255,255,255,.7);}
.fs-heart{position:absolute;font-size:26px;pointer-events:none;animation:heartFloat 1.5s ease-out forwards;}
@keyframes heartFloat{0%{transform:translateY(0) scale(.5);opacity:0;}20%{opacity:1;}100%{transform:translateY(-120px) scale(1.3);opacity:0;}}

/* Multi-Select */
.msg-checkbox{position:absolute;top:50%;transform:translateY(-50%) scale(0);width:24px;height:24px;border-radius:50%;border:2px solid rgba(244,114,182,.6);background:rgba(0,0,0,.4);display:grid;place-items:center;color:#fff;font-size:11px;transition:transform .25s cubic-bezier(.2,.8,.2,1.5),background .2s;pointer-events:none;}
.message-wrapper.outgoing .msg-checkbox{left:-32px;}
.message-wrapper.incoming .msg-checkbox{right:-32px;}
body.select-mode .msg-checkbox{transform:translateY(-50%) scale(1);}
body.select-mode .message-wrapper.selected .msg-checkbox{background:linear-gradient(135deg,#ec4899,#22c55e);border-color:transparent;transform:translateY(-50%) scale(1.15);}
body.select-mode .message-wrapper.selected .message{outline:2px solid #ec4899;outline-offset:2px;}
body.select-mode .message-wrapper.selected{opacity:.85;}
.select-mode-btn{position:fixed;top:74px;right:14px;z-index:50;padding:9px 16px;border-radius:22px;background:linear-gradient(135deg,#ec4899,#a855f7);border:none;color:#fff;font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 10px 24px rgba(236,72,153,.55);display:none;font-family:inherit;}
.select-mode-btn.show{display:block;animation:popIn .3s ease both;}
.select-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:480px;padding:14px 16px;background:rgba(20,10,32,.98);backdrop-filter:blur(24px);border-top:1px solid rgba(244,114,182,.25);display:flex;align-items:center;justify-content:space-between;z-index:1500;transition:.3s cubic-bezier(.2,.8,.2,1.2);box-shadow:0 -10px 30px rgba(236,72,153,.3);}
.select-bar.show{transform:translateX(-50%) translateY(0);}
.select-bar .count{font-size:14px;font-weight:700;color:#fbcfe8;}
.select-bar .select-actions{display:flex;gap:10px;}
.select-bar button{padding:10px 16px;border:none;border-radius:14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:.2s;}
.select-bar .cancel-select{background:rgba(255,255,255,.1);color:#fff;}
.select-bar .del-selected{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff;box-shadow:0 8px 20px rgba(239,68,68,.5);}
.select-bar button:disabled{opacity:.4;}

/* Footer */
.chat-footer{display:flex;align-items:center;padding:11px 10px;gap:8px;background:rgba(20,10,32,.88);backdrop-filter:blur(20px);border-top:1px solid rgba(244,114,182,.2);position:relative;z-index:6;flex-shrink:0;}
.actions{display:flex;gap:6px;}
.act-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(236,72,153,.12);border:1px solid rgba(244,114,182,.22);color:#fbcfe8;font-size:15px;cursor:pointer;transition:.25s cubic-bezier(.2,.8,.2,1.3);}
.act-btn:hover{background:linear-gradient(135deg,#ec4899,#a855f7);color:#fff;transform:translateY(-3px) scale(1.1);}
.act-btn.recording{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff;animation:recPulse 1s ease-in-out infinite;}
@keyframes recPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.7);}50%{box-shadow:0 0 0 10px rgba(239,68,68,0);}}
.input-box{flex:1;display:flex;align-items:center;background:rgba(236,72,153,.1);border:1px solid rgba(244,114,182,.22);border-radius:22px;padding:9px 12px;gap:6px;transition:.28s;min-width:0;}
.input-box:focus-within{border-color:rgba(236,72,153,.85);background:rgba(236,72,153,.15);box-shadow:0 0 0 4px rgba(236,72,153,.18);}
.input-box input{flex:1;border:none;background:transparent;outline:none;font-size:14.5px;color:#fff;min-width:0;font-family:inherit;}
.input-box input::placeholder{color:rgba(251,207,232,.5);}
.emoji-trigger{color:#f472b6;font-size:19px;cursor:pointer;transition:.22s;}
.emoji-trigger:hover{transform:scale(1.25) rotate(14deg);color:#ec4899;}
.send-btn{width:44px;height:44px;border-radius:50%;border:none;background:linear-gradient(135deg,#ec4899,#a855f7 60%,#f472b6);background-size:200% 200%;color:#fff;font-size:16px;cursor:pointer;display:grid;place-items:center;flex-shrink:0;box-shadow:0 10px 26px rgba(236,72,153,.6);animation:gradShift 5s ease infinite;transition:transform .18s;}
.send-btn:hover{transform:scale(1.1) rotate(-8deg);}
.recording-bar{display:none;align-items:center;justify-content:center;gap:12px;padding:14px;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);border-radius:20px;margin:6px 12px 0;font-size:13.5px;color:#fca5a5;font-weight:600;}
.recording-bar.show{display:flex;}
.recording-bar .dot{width:10px;height:10px;border-radius:50%;background:#ef4444;animation:recPulse 1s ease-in-out infinite;}

/* Modals */
.del-overlay{position:fixed;inset:0;z-index:3000;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);padding:20px;}
.del-overlay.show{display:flex;animation:fadeIn .22s ease both;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

    let uid = localStorage.getItem('chat_uid');

    for (let i = 0; i < 8; i++) {

/* ================= SEND EMOJI ================= */
function sendEmojiMessage(emoji) {
    if (!started) return;
    chatRef.push({
        type: 'emoji',
        emojiName: emoji.name,
        emojiUrl: emoji.url,
        senderName: userName,
        senderUid: myUid,
        time: nowTime()
    });
}

/* ================= START CHAT ================= */
window.startChat = function (name) {
    if (started) return;
    started = true;
    userName = name;
    usersRef.child(myUid).set({ name: userName, uid: myUid, lastSeen: Date.now() });

    chatRef.on('child_added', function (snapshot) {
        const data = snapshot.val();
        if (!data) return;
        renderMessage(data, snapshot.key);

        /* ইমোজি হলে সবাই ফুল স্ক্রিন দেখবে */
        if (data.type === 'emoji' && data.emojiUrl) {
            const emojiObj = { name: data.emojiName || '', url: data.emojiUrl };
            /* যদি অল্প আগের মেসেজ হয় (৩ সেকেন্ডের ভেতরে) */
            if (Date.now() - (snapshot.child('ts').val() || 0) < 3000 || !snapshot.child('ts').exists()) {
                showEmojiFullscreen(emojiObj, data.senderName || 'Someone');
            }
        }
    });

    chatRef.on('child_changed', function (snapshot) {
        const data = snapshot.val();
        if (!data) return;
        const el = chatBody.querySelector('[data-key="' + snapshot.key + '"]');
        if (data.deletedFor && Array.isArray(data.deletedFor) && data.deletedFor.includes(myUid)) {
            if (el) { el.style.transition = 'all .3s ease'; el.style.opacity = '0'; el.style.transform = 'scale(.7)'; setTimeout(() => el.remove(), 300); }
        }
    });
    chatRef.on('child_removed', function (snapshot) {
        const el = chatBody.querySelector('[data-key="' + snapshot.key + '"]');
        if (el) { el.style.transition = 'all .3s ease'; el.style.opacity = '0'; el.style.transform = 'scale(.7)'; setTimeout(() => el.remove(), 300); }
    });

    listenCallSignal();
    setupPresence();
    listenPresence();
    document.getElementById('selectModeBtn').classList.add('show');
    setTimeout(() => document.getElementById('messageInput').focus(), 300);
};

function renderMessage(data, msgKey) {
    if (data.deletedFor && Array.isArray(data.deletedFor) && data.deletedFor.includes(myUid)) return;

    const w = document.createElement('div');
    const isMe = data.senderUid === myUid || data.senderName === userName;
    w.classList.add('message-wrapper', isMe ? 'outgoing' : 'incoming');
    w.dataset.key = msgKey;
    w.dataset.sender = data.senderName;
    w.dataset.senderUid = data.senderUid || '';
    w.dataset.type = data.type;
    w.dataset.isMe = isMe ? '1' : '0';

    let h = '<div class="sender-name">' + esc(data.senderName || '') + '</div>';

    if (data.type === 'text') {
        h += '<div class="message ' + (isMe ? 'outgoing' : 'incoming') + '">' + esc(data.content) + '<div class="time">' + (data.time || '') + '</div></div>';
    } else if (data.type === 'image') {
        h += '<div class="message ' + (isMe ? 'outgoing' : 'incoming') + '"><img src="' + data.content + '"><div class="time">' + (data.time || '') + '</div></div>';
    } else if (data.type === 'video') {
        h += '<div class="message ' + (isMe ? 'outgoing' : 'incoming') + '"><video src="' + data.content + '" controls></video><div class="time">' + (data.time || '') + '</div></div>';
    } else if (data.type === 'audio') {
        const dur = data.duration || 0;
        h += '<div class="message ' + (isMe ? 'outgoing' : 'incoming') + '">'
           + '<div class="voice-label"><i class="fa-solid fa-microphone"></i> ভয়েস • ' + dur + 's</div>'
           + '<div class="voice-player">'
           + '<button class="play-btn" type="button"><i class="fa-solid fa-play"></i></button>'
           + '<div class="voice-bar"><div class="voice-bar-inner"></div></div>'
           + '<span class="voice-time">' + fmtTime(dur) + '</span>'
           + '<audio preload="metadata" src="' + data.content + '"></audio>'
           + '</div>'
           + '<div class="time">' + (data.time || '') + '</div></div>';
    } else if (data.type === 'emoji') {
        h += '<div class="message emoji-msg ' + (isMe ? 'outgoing' : 'incoming') + '">'
           + '<img src="' + data.emojiUrl + '" alt="' + esc(data.emojiName || '') + '">'
           + '<div class="time" style="opacity:.6;text-align:center;">' + (data.time || '') + '</div></div>';
    }
    w.innerHTML = h;

    const cb = document.createElement('div');
    cb.className = 'msg-checkbox';
    cb.innerHTML = '<i class="fa-solid fa-check"></i>';
    w.appendChild(cb);

    if (data.type === 'audio') setupVoicePlayer(w);

    let pressTimer = null;
    const openDelete = () => { if (!selectMode) openDelModal(msgKey, data.type, isMe); };
    const clearTimer = () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } };
    w.addEventListener('touchstart', () => { pressTimer = setTimeout(openDelete, 600); }, { passive: true });
    w.addEventListener('touchend', clearTimer);
    w.addEventListener('touchmove', clearTimer);
    w.addEventListener('touchcancel', clearTimer);
    w.addEventListener('mousedown', (e) => { if (e.button === 0) pressTimer = setTimeout(openDelete, 600); });
    w.addEventListener('mouseup', clearTimer);
    w.addEventListener('mouseleave', clearTimer);
    w.addEventListener('contextmenu', (e) => { e.preventDefault(); if (!selectMode) openDelete(); });

    chatBody.appendChild(w);
    chatBody.scrollTop = chatBody.scrollHeight;
}

/* ================= VOICE PLAYER ================= */
function setupVoicePlayer(wrapper) {
    const btn = wrapper.querySelector('.play-btn');
    const audio = wrapper.querySelector('audio');
    const bar = wrapper.querySelector('.voice-bar');
    const barInner = wrapper.querySelector('.voice-bar-inner');
    const timeEl = wrapper.querySelector('.voice-time');
    const icon = btn.querySelector('i');
    if (!audio) return;
    audio.addEventListener('loadedmetadata', () => { if (audio.duration && isFinite(audio.duration)) timeEl.textContent = fmtTime(audio.duration); });
    audio.addEventListener('timeupdate', () => {
        if (audio.duration && isFinite(audio.duration) && audio.duration > 0) {
            barInner.style.width = (audio.currentTime / audio.duration * 100) + '%';
            timeEl.textContent = fmtTime(audio.currentTime);
        }
    });
    audio.addEventListener('ended', () => { icon.className = 'fa-solid fa-play'; barInner.style.width = '0%'; if (audio.duration) timeEl.textContent = fmtTime(audio.duration); });
    audio.addEventListener('error', () => { timeEl.textContent = '⚠️'; icon.className = 'fa-solid fa-triangle-exclamation'; });
    btn.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.voice-player audio').forEach(a => {
            if (a !== audio && !a.paused) {
                a.pause(); a.currentTime = 0;
                const p = a.closest('.voice-player');
                if (p) { p.querySelector('.play-btn i').className = 'fa-solid fa-play'; p.querySelector('.voice-bar-inner').style.width = '0%'; }
            }
        });
        if (audio.paused) { audio.play().then(() => { icon.className = 'fa-solid fa-pause'; }).catch(() => showToast('⚠️ ভয়েস চালানো যায়নি')); }
        else { audio.pause(); icon.className = 'fa-solid fa-play'; }
    });
    bar.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!audio.duration || !isFinite(audio.duration)) return;
        const rect = bar.getBoundingClientRect();
        audio.currentTime = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width)) * audio.duration;
    });
}

/* ================= MULTI-SELECT ================= */

function updateSelectUI() {

    document.getElementById('delSelectedBtn').disabled = selectedKeys.size === 0;
}

    const key = wrapper.dataset.key;

window.deleteSelectedMessages = async function () {
    if (selectedKeys.size === 0) { showToast('⚠️ কিছু সিলেক্ট করুন'); return; }
    if (!confirm(selectedKeys.size + 'টি মেসেজ আপনার থেকে ডিলিট করবেন?')) return;

/* ================= VOICE RECORDING ================= */
let mediaRecorder = null, audioChunks = [], isRecording = false;
let recTimerInterval = null, recStartTime = 0, recTimeout = null;
const MAX_REC_MS = 60 * 1000;
window.toggleRecording = async function () {
    if (!started) return;
    if (isRecording) { stopRecording(); return; }
    await startRecording();
};
async function startRecording() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];
        let mimeType = '';
        if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) mimeType = 'audio/webm;codecs=opus';
        else if (MediaRecorder.isTypeSupported('audio/webm')) mimeType = 'audio/webm';
        else if (MediaRecorder.isTypeSupported('audio/mp4')) mimeType = 'audio/mp4';
        else if (MediaRecorder.isTypeSupported('audio/ogg')) mimeType = 'audio/ogg';
        mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
        mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = () => {
            stream.getTracks().forEach(t => t.stop());
            const blob = new Blob(audioChunks, { type: mimeType || 'audio/webm' });
            const dur = Math.round((Date.now() - recStartTime) / 1000);
            if (blob.size < 800 || dur < 1) { resetRecUI(); return; }
            const reader = new FileReader();
            reader.onload = () => {
                chatRef.push({ type: 'audio', content: reader.result, duration: dur, mime: mimeType, senderName: userName, senderUid: myUid, time: nowTime() });
                showToast('🎤 ভয়েস পাঠানো হয়েছে (' + dur + 's)');
            };
            reader.readAsDataURL(blob);
            resetRecUI();
        };
        mediaRecorder.start();
        isRecording = true;
        recStartTime = Date.now();
        document.getElementById('micBtn').classList.add('recording');
        document.getElementById('recordingBar').classList.add('show');
        document.getElementById('recTime').textContent = '00:00';
        recTimerInterval = setInterval(() => { document.getElementById('recTime').textContent = fmtTime(Math.floor((Date.now() - recStartTime) / 1000)); }, 250);
        recTimeout = setTimeout(() => { if (isRecording) stopRecording(); }, MAX_REC_MS);
        if (navigator.vibrate) navigator.vibrate(40);
    } catch (err) { alert('মাইক অ্যাক্সেস নেই: ' + err.message); resetRecUI(); }
}
function stopRecording() { if (mediaRecorder && isRecording) { try { mediaRecorder.stop(); } catch (e) {} isRecording = false; if (navigator.vibrate) navigator.vibrate(30); } }
function resetRecUI() {
    isRecording = false;
    if (recTimerInterval) { clearInterval(recTimerInterval); recTimerInterval = null; }
    if (recTimeout) { clearTimeout(recTimeout); recTimeout = null; }
    document.getElementById('micBtn').classList.remove('recording');
    document.getElementById('recordingBar').classList.remove('show');
    document.getElementById('recTime').textContent = '00:00';
    mediaRecorder = null; audioChunks = [];
}

/* ================= LOCK / PIN ================= */
(function () {
    const CORRECT_PIN = "0171";
    let pin = ""; let unlocked = false;
    const lockScreen = document.getElementById('lockScreen');
    const lockCard = document.getElementById('lockCard');
    const dots = Array.from(document.querySelectorAll('#pinDots span'));
    const pinMsg = document.getElementById('pinMsg');
    const keypad = document.getElementById('keypad');
    const pinStep = document.getElementById('pinStep');
    const nameStep = document.getElementById('nameStep');
    const nameInput = document.getElementById('nameInput');
    const nameBtn = document.getElementById('nameBtn');
    function renderDots() { dots.forEach((d, i) => d.classList.toggle('filled', i < pin.length)); }
    function wrongPin() {
        lockCard.classList.add('shake');
        pinMsg.textContent = '❌ ভুল পাসওয়ার্ড!'; pinMsg.classList.remove('good');
        dots.forEach(d => d.classList.add('filled'));
        setTimeout(() => { lockCard.classList.remove('shake'); pin = ""; renderDots(); dots.forEach(d => d.classList.remove('ok')); }, 600);
        if (navigator.vibrate) navigator.vibrate(180);
    }
    function rightPin() {
        dots.forEach(d => d.classList.add('filled', 'ok'));
        pinMsg.textContent = '✅ সঠিক! 💕'; pinMsg.classList.add('good');
        if (navigator.vibrate) navigator.vibrate([40, 40, 80]);
        setTimeout(() => {
            const s = localStorage.getItem('chat_user_name');
            if (s && s.trim()) unlock(s);
            else { pinStep.style.display = 'none'; nameStep.classList.add('show'); setTimeout(() => nameInput.focus(), 250); }
        }, 520);
    }
    function checkPin() { if (pin.length < 4) return; pin === CORRECT_PIN ? rightPin() : wrongPin(); }
    keypad.addEventListener('click', e => {
        const b = e.target.closest('.key');
        if (!b || b.classList.contains('ghost')) return;
        const k = b.dataset.key; if (!k) return;
        if (k === 'del') { pin = pin.slice(0, -1); renderDots(); return; }
        if (pin.length >= 4) return;
        pin += k; renderDots();
        if (pin.length === 4) setTimeout(checkPin, 140);
    });
    document.addEventListener('keydown', e => {
        if (unlocked) return;
        if (nameStep.classList.contains('show')) { if (e.key === 'Enter') submitName(); return; }
        if (/^[0-9]$/.test(e.key)) { if (pin.length < 4) { pin += e.key; renderDots(); if (pin.length === 4) setTimeout(checkPin, 140); } }
        else if (e.key === 'Backspace') { pin = pin.slice(0, -1); renderDots(); }
    });
    function submitName() {
        let n = (nameInput.value || '').trim() || 'Anonymous';
        localStorage.setItem('chat_user_name', n);
        unlock(n);
    }
    nameBtn.addEventListener('click', submitName);
    nameInput.addEventListener('keypress', e => { if (e.key === 'Enter') submitName(); });
    function unlock(name) {
        if (unlocked) return; unlocked = true;
        lockScreen.classList.add('hide');
        setTimeout(() => {
            lockScreen.style.display = 'none';
            if (typeof window.startChat === 'function') window.startChat(name);
            else alert("লোড হয়নি! রিফ্রেশ করুন।");
        }, 500);
    }
    renderDots();
})();

/* ================= ZEGOCLOUD CALL ================= */
let zegoInstance = null;
let currentCallType = 'audio';
let isInCall = false;
let incomingSignalData = null;

window.startCall = async function (type) {
    if (!started) return;
    if (isInCall) { alert('ইতিমধ্যে একটা কলে আছেন'); return; }
    currentCallType = type;
    const sigRef = callSignalRef.push();
    await sigRef.set({
        caller: userName, callerUid: myUid, type: type,
        roomId: VOICE_ROOM_ID, status: 'ringing', time: Date.now()
    });
    joinZegoRoom(type, sigRef.key);
};

function joinZegoRoom(type, signalKey) {
    if (zegoInstance) return;
    isInCall = true;
    const container = document.getElementById('zegoContainer');
    container.classList.add('show');
    try {
        const kitToken = ZegoUIKitPrebuilt.generateKitTokenForTest(ZEGO_APP_ID, ZEGO_SERVER_SECRET, VOICE_ROOM_ID, myUid, userName);
        zegoInstance = ZegoUIKitPrebuilt.create(kitToken);
        zegoInstance.joinRoom({
            container: container,
            scenario: { mode: ZegoUIKitPrebuilt.GroupCall },
            showScreenSharingButton: false,
            showPreJoinView: false,
            turnOnCameraWhenJoining: type === 'video',
            turnOnMicrophoneWhenJoining: true,
            showTextChat: false,
            showUserList: true,
            showLeavingView: false,
            onJoinRoom: () => { showToast('💕 কলে যুক্ত হয়েছেন'); },
            onLeaveRoom: () => {
                container.classList.remove('show');
                zegoInstance = null;
                isInCall = false;
                if (signalKey) {
                    callSignalRef.child(signalKey + '/status').set('ended');
                    setTimeout(() => callSignalRef.child(signalKey).remove(), 2000);
                }
            }
        });
    } catch (err) {
        alert('কল শুরু করা যায়নি: ' + err.message);
        isInCall = false;
        container.classList.remove('show');
    }
}

let signalListenerAttached = false;
function listenCallSignal() {
    if (signalListenerAttached) return;
    signalListenerAttached = true;
    callSignalRef.on('child_added', snap => {
        const sig = snap.val();
        if (!sig || sig.status !== 'ringing') return;
        if (sig.callerUid === myUid) return;
        if (isInCall) return;
        if (Date.now() - sig.time > 60000) { callSignalRef.child(snap.key).remove(); return; }
        incomingSignalData = { id: snap.key, ...sig };
        document.getElementById('incomingName').textContent = sig.caller;
        document.getElementById('incomingType').textContent = sig.type === 'video' ? 'ইনকামিং ভিডিও কল...' : 'ইনকামিং অডিও কল...';
        document.getElementById('incomingOverlay').classList.add('show');
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    });
    callSignalRef.on('child_changed', snap => {
        const sig = snap.val();
        if (!sig) return;
        if (sig.status === 'ended' || sig.status === 'rejected') {
            if (incomingSignalData && incomingSignalData.id === snap.key) hideIncomingModal();
        }
    });
}
function hideIncomingModal() {
    document.getElementById('incomingOverlay').classList.remove('show');
    incomingSignalData = null;
}
window.acceptCall = async function () {
    if (!incomingSignalData) return;
    const sig = incomingSignalData;
    hideIncomingModal();
    currentCallType = sig.type;
    await callSignalRef.child(sig.id + '/status').set('accepted');
    joinZegoRoom(sig.type, sig.id);
};
window.rejectCall = function () {
    if (incomingSignalData) {
        callSignalRef.child(incomingSignalData.id + '/status').set('rejected');
        setTimeout(() => callSignalRef.child(incomingSignalData.id).remove(), 1000);
    }
    hideIncomingModal();
};

window.addEventListener('beforeunload', () => {
    if (zegoInstance) { try { zegoInstance.leaveRoom(); } catch (e) {} }
});
</script>
