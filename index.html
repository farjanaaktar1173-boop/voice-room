<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Advanced Messenger Chat</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,'Noto Sans Bengali',Tahoma,sans-serif;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;}
    body{background:#0b0a1a;display:flex;justify-content:center;align-items:center;height:100dvh;overflow:hidden;color:#fff;position:relative;}

    /* Background Orbs */
    .bg-orbs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
    .bg-orbs span{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;}
    .bg-orbs span:nth-child(1){width:340px;height:340px;background:#6a5cff;top:-90px;left:-90px;animation:float1 16s ease-in-out infinite;}
    .bg-orbs span:nth-child(2){width:300px;height:300px;background:#00d4ff;bottom:-100px;right:-80px;animation:float2 19s ease-in-out infinite;}
    .bg-orbs span:nth-child(3){width:260px;height:260px;background:#ec4899;top:45%;left:58%;animation:float3 22s ease-in-out infinite;}
    @keyframes float1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(80px,60px) scale(1.25);}}
    @keyframes float2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-70px,-70px) scale(1.18);}}
    @keyframes float3{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-90px,50px) scale(1.3);}}

    /* Lock Screen */
    .lock-screen{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0%, #241b4d 0%, #0b0a1a 65%);transition:opacity .65s ease,transform .65s ease,filter .65s ease;padding:18px;}
    .lock-screen.hide{opacity:0;transform:scale(1.15);filter:blur(14px);pointer-events:none;}
    .lock-emoji-float{position:absolute;font-size:26px;opacity:.18;animation:floatEmoji 9s ease-in-out infinite;user-select:none;}
    @keyframes floatEmoji{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-28px) rotate(14deg);}}
    .lock-card{width:min(92vw,380px);padding:30px 24px 26px;border-radius:30px;background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);box-shadow:0 34px 80px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.28);text-align:center;position:relative;animation:cardIn .8s cubic-bezier(.2,.8,.2,1.1) both;}
    @keyframes cardIn{from{opacity:0;transform:translateY(40px) scale(.9);}to{opacity:1;transform:translateY(0) scale(1);}}
    .lock-card.shake{animation:shake .55s cubic-bezier(.36,.07,.19,.97);}
    @keyframes shake{10%,90%{transform:translateX(-6px);}20%,80%{transform:translateX(6px);}30%,50%,70%{transform:translateX(-10px);}40%,60%{transform:translateX(10px);}}
    .lock-badge{width:78px;height:78px;margin:0 auto 16px;border-radius:26px;display:grid;place-items:center;font-size:34px;background:linear-gradient(145deg,rgba(106,92,255,.55),rgba(0,212,255,.3));border:1px solid rgba(255,255,255,.22);box-shadow:0 16px 36px rgba(106,92,255,.5),inset 0 2px 6px rgba(255,255,255,.35);animation:badgeFloat 3.2s ease-in-out infinite;}
    @keyframes badgeFloat{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-8px) rotate(-4deg);}}
    .lock-card h1{font-size:22px;font-weight:700;letter-spacing:.4px;background:linear-gradient(90deg,#fff,#b9aeff,#7fe6ff);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px;}
    .lock-sub{font-size:13px;color:rgba(255,255,255,.6);margin-bottom:4px;}
    .pin-dots{display:flex;justify-content:center;gap:14px;margin:22px 0 8px;}
    .pin-dots span{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);transition:.28s cubic-bezier(.2,.8,.2,1.5);}
    .pin-dots span.filled{background:linear-gradient(135deg,#6a5cff,#00d4ff);border-color:transparent;transform:scale(1.3);box-shadow:0 0 18px rgba(106,92,255,.95);}
    .pin-dots span.ok{background:linear-gradient(135deg,#22c55e,#4ade80);border-color:transparent;box-shadow:0 0 20px rgba(34,197,94,.9);}
    .pin-msg{min-height:20px;font-size:12.5px;font-weight:600;color:#ff7a8a;letter-spacing:.3px;transition:.2s;}
    .pin-msg.good{color:#4ade80;}
    .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:20px;}
    .key{height:56px;border-radius:19px;border:1px solid rgba(255,255,255,.12);background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.03));color:#fff;font-size:20px;font-weight:600;cursor:pointer;display:grid;place-items:center;transition:transform .16s ease,background .25s,box-shadow .25s;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 6px 14px rgba(0,0,0,.35);font-family:inherit;}
    .key:hover{background:linear-gradient(160deg,rgba(106,92,255,.55),rgba(0,212,255,.25));transform:translateY(-3px);box-shadow:0 12px 24px rgba(106,92,255,.45);}
    .key:active{transform:scale(.9);}
    .key.ghost{background:transparent;border:none;box-shadow:none;cursor:default;pointer-events:none;}
    .name-step{display:none;}
    .name-step.show{display:block;animation:cardIn .5s ease both;}
    .name-input{width:100%;margin-top:20px;padding:15px 18px;border-radius:18px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#fff;font-size:15px;outline:none;text-align:center;transition:.25s;font-family:inherit;}
    .name-input::placeholder{color:rgba(255,255,255,.4);}
    .name-input:focus{border-color:rgba(106,92,255,.9);box-shadow:0 0 0 4px rgba(106,92,255,.22);background:rgba(255,255,255,.11);}
    .btn-primary{width:100%;margin-top:14px;padding:15px;border:none;border-radius:18px;font-size:15px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit;background:linear-gradient(135deg,#6a5cff,#a855f7 55%,#00d4ff);background-size:200% 200%;box-shadow:0 14px 30px rgba(106,92,255,.5),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .18s,box-shadow .25s;animation:gradShift 5s ease infinite;}
    @keyframes gradShift{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
    .btn-primary:hover{transform:translateY(-3px);box-shadow:0 18px 38px rgba(106,92,255,.65);}

    /* Chat Container */
    .chat-container{width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;background:rgba(18,16,38,.78);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 34px 90px rgba(0,0,0,.7);overflow:hidden;position:relative;z-index:2;animation:chatIn .8s cubic-bezier(.2,.8,.2,1) both;}
    @keyframes chatIn{from{opacity:0;transform:translateY(26px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
    @media(min-width:520px){.chat-container{height:92dvh;border-radius:28px;border:1px solid rgba(255,255,255,.1);}}
    .chat-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:linear-gradient(135deg,rgba(106,92,255,.35),rgba(0,212,255,.14));border-bottom:1px solid rgba(255,255,255,.09);position:relative;z-index:5;flex-shrink:0;}
    .user-info{display:flex;align-items:center;gap:10px;min-width:0;}
    .back-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#d9d5ff;font-size:16px;cursor:pointer;transition:.22s;flex-shrink:0;}
    .back-btn:hover{background:rgba(255,255,255,.12);transform:translateX(-3px);}
    .avatar-wrap{position:relative;width:44px;height:44px;flex-shrink:0;}
    .avatar-wrap img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.28);box-shadow:0 6px 16px rgba(0,0,0,.45);}
    .avatar-wrap::after{content:'';position:absolute;bottom:1px;right:1px;width:12px;height:12px;border-radius:50%;background:#22c55e;border:2px solid #17142f;box-shadow:0 0 10px rgba(34,197,94,.95);animation:onlinePulse 2s ease-in-out infinite;}
    @keyframes onlinePulse{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.75);}50%{box-shadow:0 0 0 6px rgba(34,197,94,0);}}
    .user-details{min-width:0;}
    .user-details h3{font-size:15.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;}
    .user-details span{font-size:11.5px;color:#6ee7a0;font-weight:600;letter-spacing:.3px;}
    .header-icons{display:flex;gap:8px;}
    .icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);color:#c9c6ff;font-size:14px;cursor:pointer;transition:.25s cubic-bezier(.2,.8,.2,1.3);}
    .icon-btn:hover{background:linear-gradient(135deg,rgba(106,92,255,.65),rgba(0,212,255,.4));color:#fff;transform:translateY(-3px) scale(1.1);box-shadow:0 10px 22px rgba(106,92,255,.5);}
    .chat-body{flex:1;padding:18px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;background:radial-gradient(circle at 15% 10%,rgba(106,92,255,.10),transparent 45%),radial-gradient(circle at 85% 85%,rgba(0,212,255,.08),transparent 45%);scroll-behavior:smooth;overscroll-behavior:contain;}
    .chat-body::-webkit-scrollbar{width:6px;}
    .chat-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:10px;}
    .message-wrapper{display:flex;flex-direction:column;max-width:78%;animation:popIn .42s cubic-bezier(.18,.89,.32,1.28) both;}
    @keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.94);}to{opacity:1;transform:translateY(0) scale(1);}}
    .message-wrapper.outgoing{align-self:flex-end;align-items:flex-end;}
    .message-wrapper.incoming{align-self:flex-start;align-items:flex-start;}
    .sender-name{font-size:11px;color:rgba(255,255,255,.55);margin-bottom:4px;margin-left:6px;font-weight:600;}
    .message{padding:10px 14px;border-radius:19px;font-size:14.5px;line-height:1.55;position:relative;word-wrap:break-word;width:100%;box-shadow:0 8px 22px rgba(0,0,0,.3);}
    .message.incoming{background:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.1);color:#eaeaff;border-bottom-left-radius:6px;}
    .message.outgoing{background:linear-gradient(135deg,#6a5cff,#8b5cf6 55%,#a855f7);color:#fff;border-bottom-right-radius:6px;box-shadow:0 10px 26px rgba(106,92,255,.45),inset 0 1px 0 rgba(255,255,255,.28);}
    .message img,.message video{max-width:100%;border-radius:12px;margin-top:5px;display:block;}
    .time{font-size:10px;margin-top:5px;opacity:.72;text-align:right;}
    .message.incoming .time{text-align:left;}
    .chat-footer{display:flex;align-items:center;padding:11px 12px;gap:9px;background:rgba(12,10,28,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.09);position:relative;z-index:6;flex-shrink:0;}
    .actions{display:flex;gap:7px;}
    .act-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);color:#a9a3ff;font-size:16px;cursor:pointer;transition:.25s cubic-bezier(.2,.8,.2,1.3);}
    .act-btn:hover{background:linear-gradient(135deg,rgba(106,92,255,.7),rgba(0,212,255,.45));color:#fff;transform:translateY(-3px) scale(1.1);}
    .input-box{flex:1;display:flex;align-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:9px 14px;gap:8px;transition:.28s;min-width:0;}
    .input-box:focus-within{border-color:rgba(106,92,255,.85);background:rgba(255,255,255,.11);box-shadow:0 0 0 4px rgba(106,92,255,.18);}
    .input-box input{flex:1;border:none;background:transparent;outline:none;font-size:14.5px;color:#fff;min-width:0;font-family:inherit;}
    .input-box input::placeholder{color:rgba(255,255,255,.42);}
    .emoji-trigger{color:#8b83ff;font-size:19px;cursor:pointer;transition:.22s;}
    .emoji-trigger:hover{transform:scale(1.25) rotate(14deg);color:#00d4ff;}
    .send-btn{width:46px;height:46px;border-radius:50%;border:none;background:linear-gradient(135deg,#6a5cff,#a855f7 60%,#00d4ff);background-size:200% 200%;color:#fff;font-size:17px;cursor:pointer;display:grid;place-items:center;flex-shrink:0;box-shadow:0 10px 26px rgba(106,92,255,.55),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .18s cubic-bezier(.2,.8,.2,1.4);animation:gradShift 5s ease infinite;}
    .send-btn:hover{transform:scale(1.1) rotate(-8deg);}
    .send-btn:active{transform:scale(.86);}
    .emoji-picker{position:absolute;bottom:78px;left:12px;width:252px;display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:12px;border-radius:22px;background:rgba(22,20,45,.95);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.14);box-shadow:0 24px 60px rgba(0,0,0,.65);z-index:100;opacity:0;visibility:hidden;transform:translateY(16px) scale(.9);transform-origin:bottom left;transition:.3s cubic-bezier(.2,.8,.2,1.25);}
    .emoji-picker.show{opacity:1;visibility:visible;transform:translateY(0) scale(1);}
    .emoji-picker span{font-size:22px;cursor:pointer;text-align:center;border-radius:10px;padding:3px 0;transition:transform .18s cubic-bezier(.2,.8,.2,1.5);user-select:none;}
    .emoji-picker span:hover{transform:scale(1.4) rotate(-10deg);background:rgba(255,255,255,.1);}
</style>
</head><body>

<!-- CHAT APP -->

    <div class="chat-header">

        <span onclick="addEmoji('🎉')">🎉</span>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
    /* ================== FIREBASE SETUP ================== */
    const firebaseConfig = {
        apiKey: "AIzaSyCTn3QEYtRMxm7Y91RSFSvbRJSRHcXMEdI",
        authDomain: "room-7fbf7.firebaseapp.com",
        databaseURL: "https://room-7fbf7-default-rtdb.firebaseio.com",
        projectId: "room-7fbf7",
        storageBucket: "room-7fbf7.firebasestorage.app",
        messagingSenderId: "417946695868",
        appId: "1:417946695868:web:34c6f63269aaf659b2b8b9"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const chatRef = db.ref('chats');
    const chatBody = document.getElementById('chatBody');
    let userName = "";
    let started = false;

    /* ================== START CHAT ================== */
    window.startChat = function (name) {
        if (started) return;
        started = true;
        userName = name;
        document.getElementById('roomTitle').innerText = 'Chat (' + userName + ')';

        chatRef.on('child_added', function (snapshot) {
            const data = snapshot.val();
            if (!data) return;
            const wrapperDiv = document.createElement('div');
            const isMe = data.senderName === userName;
            wrapperDiv.classList.add('message-wrapper', isMe ? 'outgoing' : 'incoming');

            let html = '<div class="sender-name">' + escapeHtml(data.senderName || '') + '</div>';
            if (data.type === 'text') {
                html += '<div class="message ' + (isMe ? 'outgoing' : 'incoming') + '">' + escapeHtml(data.content) + '<div class="time">' + (data.time || '') + '</div></div>';
            } else if (data.type === 'image') {
                html += '<div class="message ' + (isMe ? 'outgoing' : 'incoming') + '"><img src="' + data.content + '"><div class="time">' + (data.time || '') + '</div></div>';
            } else if (data.type === 'video') {
                html += '<div class="message ' + (isMe ? 'outgoing' : 'incoming') + '"><video src="' + data.content + '" controls></video><div class="time">' + (data.time || '') + '</div></div>';
            }
            wrapperDiv.innerHTML = html;
            chatBody.appendChild(wrapperDiv);
            chatBody.scrollTop = chatBody.scrollHeight;
        });

        setTimeout(() => document.getElementById('messageInput').focus(), 300);
    };

    function nowTime() {
        return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    window.sendTextMessage = function () {
        if (!started) return;
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (text === "") return;
        chatRef.push({ type: 'text', content: text, senderName: userName, time: nowTime() });
        input.value = "";
        input.focus();
    };

    window.handleKeyPress = function (e) {
        if (e.key === 'Enter') window.sendTextMessage();
    };

    window.sendFile = function (event, type) {
        if (!started) return;
        const file = event.target.files[0];
        if (!file) return;
        if (file.size > 15 * 1024 * 1024) {
            alert("ফাইলটি খুব বড়! ১৫ MB এর কম সাইজের ফাইল দিন।");
            event.target.value = "";
            return;
        }
        const reader = new FileReader();
        reader.onload = function (e) {
            chatRef.push({ type: type, content: e.target.result, senderName: userName, time: nowTime() });
        };
        reader.readAsDataURL(file);
        event.target.value = "";
    };

    function escapeHtml(text) {
        return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    /* ================== LOCK / PIN LOGIC ================== */
    (function () {
        const CORRECT_PIN = "0171";
        let pin = "";
        let unlocked = false;

        const lockScreen = document.getElementById('lockScreen');
        const lockCard = document.getElementById('lockCard');
        const dots = Array.from(document.querySelectorAll('#pinDots span'));
        const pinMsg = document.getElementById('pinMsg');
        const keypad = document.getElementById('keypad');
        const pinStep = document.getElementById('pinStep');
        const nameStep = document.getElementById('nameStep');
        const nameInput = document.getElementById('nameInput');
        const nameBtn = document.getElementById('nameBtn');

        function renderDots() {
            dots.forEach((d, i) => d.classList.toggle('filled', i < pin.length));
        }

        function wrongPin() {
            lockCard.classList.add('shake');
            pinMsg.textContent = '❌ ভুল পাসওয়ার্ড! আবার চেষ্টা করুন';
            pinMsg.classList.remove('good');
            dots.forEach(d => d.classList.add('filled'));
            setTimeout(() => {
                lockCard.classList.remove('shake');
                pin = "";
                renderDots();
                dots.forEach(d => d.classList.remove('ok'));
            }, 600);
            if (navigator.vibrate) navigator.vibrate(180);
        }

        function rightPin() {
            dots.forEach(d => { d.classList.add('filled', 'ok'); });
            pinMsg.textContent = '✅ সঠিক পাসওয়ার্ড!';
            pinMsg.classList.add('good');
            if (navigator.vibrate) navigator.vibrate([40, 40, 80]);
            setTimeout(() => {
                const saved = localStorage.getItem('chat_user_name');
                if (saved && saved.trim() !== '') {
                    unlock(saved);
                } else {
                    pinStep.style.display = 'none';
                    nameStep.classList.add('show');
                    setTimeout(() => nameInput.focus(), 250);
                }
            }, 520);
        }

        function checkPin() {
            if (pin.length < 4) return;
            if (pin === CORRECT_PIN) rightPin();
            else wrongPin();
        }

        keypad.addEventListener('click', (e) => {
            const btn = e.target.closest('.key');
            if (!btn || btn.classList.contains('ghost')) return;
            const k = btn.dataset.key;
            if (!k) return;
            if (k === 'del') { pin = pin.slice(0, -1); renderDots(); return; }
            if (pin.length >= 4) return;
            pin += k;
            renderDots();
            if (pin.length === 4) setTimeout(checkPin, 140);
        });

        document.addEventListener('keydown', (e) => {
            if (unlocked) return;
            if (nameStep.classList.contains('show')) {
                if (e.key === 'Enter') submitName();
                return;
            }
            if (/^[0-9]$/.test(e.key)) {
                if (pin.length < 4) {
                    pin += e.key;
                    renderDots();
                    if (pin.length === 4) setTimeout(checkPin, 140);
                }
            } else if (e.key === 'Backspace') {
                pin = pin.slice(0, -1);
                renderDots();
            }
        });

        function submitName() {
            let n = (nameInput.value || '').trim();
            if (n === '') n = 'Anonymous';
            localStorage.setItem('chat_user_name', n);
            unlock(n);
        }

        nameBtn.addEventListener('click', submitName);
        nameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') submitName(); });

        function unlock(name) {
            if (unlocked) return;
            unlocked = true;
            lockScreen.classList.add('hide');
            // Firebase compat SDK sync-এ লোড হয়, তাই startChat সাথে সাথেই পাওয়া যাবে
            setTimeout(() => {
                lockScreen.style.display = 'none';
                if (typeof window.startChat === 'function') {
                    window.startChat(name);
                } else {
                    alert("চ্যাট লোড হয়নি! পেজ রিফ্রেশ করুন।");
                }
            }, 500);
        }

        renderDots();
    })();

    /* ================== EMOJI ================== */
    function toggleEmojiPicker(e) {
        if (e) e.stopPropagation();
        document.getElementById('emojiPicker').classList.toggle('show');
    }
    function addEmoji(emoji) {
        const input = document.getElementById('messageInput');
        input.value += emoji;
        input.focus();
    }
    document.addEventListener('click', function (e) {
        const picker = document.getElementById('emojiPicker');
        if (!picker.classList.contains('show')) return;
        if (!picker.contains(e.target) && !e.target.closest('.emoji-trigger')) {
            picker.classList.remove('show');
        }
    });
</script>
</body>
</html>
